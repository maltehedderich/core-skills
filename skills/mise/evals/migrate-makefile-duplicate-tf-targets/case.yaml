schema_version: "1.1"
name: migrate-makefile-duplicate-tf-targets
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The Makefile is gone and mise.toml defines tasks with canonical names only: setup, dev, test,
  test:unit, lint, format, check, docker:build, deploy, db:migrate, and tf:init/plan/apply.
  The duplicate Terraform targets collapse into tf:* tasks that act on the mise config environment
  selected with -E (mise.development.toml, mise.staging.toml, mise.production.toml, each setting
  DEPLOY_ENV), with no environment or "terraform" in any task name, no aliases, and no environment argument.
  Terraform moves from infra/{dev,staging,prod} to terraform/environments/{development,staging,production}.
  Secrets come from fnox with Proton Pass locally. CI uses mise with MISE_ENV set to the chosen environment,
  SECRETS_FROM_ENV, and GitHub secrets. CI workflows and the README call mise run (mise -E <env> run for
  environment tasks). The report maps every old target to its new task and points
  out that terraform-apply used -auto-approve while tf-apply did not, without silently picking one.
  Nothing is applied or deployed.
