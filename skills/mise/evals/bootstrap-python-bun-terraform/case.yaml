schema_version: "1.1"
name: bootstrap-python-bun-terraform
context:
  scaffold_script: place-files.sh
expected_outcome: |
  mise.toml pins python, uv, bun, terraform, fnox and the Proton Pass CLI (aqua:protonpass/pass-cli) as
  major.minor versions with lockfile = true, uses uv for Python and bun for web/, and defines canonical
  tasks (setup, dev, build, test, lint, format, typecheck where it applies, check, tf:init/plan/apply/destroy/output
  tf:lint, tf:format). Each deployment environment has a mise.<env>.toml (development, staging, production)
  that sets DEPLOY_ENV and FNOX_PROFILE; mise.toml unsets DEPLOY_ENV, and the tf:* tasks extend one
  template that requires it, so they run as `mise -E <env> run tf:apply`. tf:apply plans and asks itself. Terraform lives in terraform/environments/<env>/ plus terraform/modules/.
  fnox.toml references HCLOUD_TOKEN and TF_VAR_db_password in Proton Pass vaults named after the
  project and environment, contains no secret values, and the Terraform commands get them through a
  with_tf_secrets wrapper that renders empty when SECRETS_FROM_ENV is set. There is no mise.ci.toml: the
  Terraform workflow sets MISE_ENV to the chosen environment plus SECRETS_FROM_ENV and maps GitHub
  environment secrets onto the tf:apply step. The report lists the vaults, items and
  GitHub environment secrets the user must create. Nothing is applied.
